# Render.com 원클릭 배포 설정
# https://render.com → New + → Blueprint → 이 저장소 연결

services:
  - type: web
    name: emotion-ai
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements-deploy.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: USE_LIGHT_ML
        value: "1"
      - key: RENDER
        value: "true"
