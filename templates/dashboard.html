{% extends "base.html" %}
{% block title %}대시보드{% endblock %}

{% block content %}
<section class="dashboard">
  <header class="dash-header">
    <div>
      <h2>안녕하세요, <span id="displayName">{{ user }}</span>님</h2>
      <p class="dash-sub">표정을 분석한 뒤 채팅하면 감정에 맞는 답변을 받을 수 있어요.</p>
    </div>
    <button type="button" id="logoutBtn" class="btn btn-ghost">로그아웃</button>
  </header>

  <div class="dash-layout">
    <div class="dash-camera-sticky glass">
      <div class="camera-wrap dash-camera">
        <video id="dashVideo" autoplay playsinline muted></video>
        <canvas id="dashCanvas" hidden></canvas>
        <div id="faceOverlay" class="face-overlay" hidden></div>
        <div id="liveEmotionChip" class="live-emotion-chip" hidden>
          <span id="liveEmotionEmoji" class="chip-emoji" aria-hidden="true"></span>
          <span id="liveEmotionLabel"></span>
          <span id="liveEmotionConf" class="confidence"></span>
        </div>
      </div>
      <p id="dashStatus" class="status-text dash-status" hidden aria-live="polite"></p>
      <div class="dash-actions-row">
        <button type="button" id="analyzeBtn" class="btn btn-secondary touch-btn">표정 분석</button>
        <button type="button" id="galleryAnalyzeBtn" class="btn btn-ghost touch-btn">사진</button>
        <button type="button" id="refaceBtn" class="btn btn-ghost touch-btn">얼굴 재등록</button>
      </div>
      <input type="file" id="galleryAnalyzeInput" accept="image/*" capture="user" hidden>
    </div>

    <section class="panel chat-panel glass">
      <header class="chat-panel-header">
        <h3>AI 챗봇</h3>
        <div id="chatEmotionBadge" class="chat-emotion-badge" hidden>
          <span id="chatEmotionEmoji" aria-hidden="true"></span>
          <span id="chatEmotionLabel">평온</span>
        </div>
      </header>

      <div class="chat-scroll-wrap">
        <div id="chatMessages" class="chat-messages" role="log" aria-live="polite">
          <div class="msg bot">
            <span class="msg-avatar" aria-hidden="true">🤖</span>
            <div class="msg-body">
              <p>😌 안녕하세요! 먼저 <strong>표정 분석</strong>을 누르거나, 아래 <strong>표정 반영</strong>을 눌러 주세요. 그다음 메시지를 내면 지금 기분에 맞게 답해 드릴게요.</p>
            </div>
          </div>
          <div id="chatTyping" class="msg bot chat-typing" hidden aria-hidden="true">
            <span class="msg-avatar" aria-hidden="true">🤖</span>
            <div class="msg-body typing-body">
              <span class="typing-dots"><span></span><span></span><span></span></span>
            </div>
          </div>
        </div>
      </div>

      <form id="chatForm" class="chat-form">
        <label class="sr-only" for="chatInput">메시지</label>
        <textarea
          id="chatInput"
          rows="1"
          placeholder="메시지를 입력하세요 (Enter 전송)"
          autocomplete="off"
          required
        ></textarea>
        <div class="chat-form-actions">
          <button type="button" id="syncEmotionBtn" class="btn btn-ghost btn-sm touch-btn">표정 반영</button>
          <button type="submit" id="chatSendBtn" class="btn btn-primary touch-btn">전송</button>
        </div>
      </form>
    </section>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/camera.js') }}"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
