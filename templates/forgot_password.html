{% extends "base.html" %}
{% block title %}비밀번호 재설정{% endblock %}
{% block head %}<meta name="robots" content="noindex,nofollow">{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="auth-card glass">
    <h2>비밀번호 재설정</h2>
    <p class="auth-sub">가입할 때 입력한 이메일 주소로 재설정 링크를 보내거나, 인증번호를 받아 바로 새 비밀번호를 만들 수 있습니다.</p>
    <form id="forgotPasswordForm" class="auth-form">
      <label>
        <span>이메일</span>
        <input type="email" name="email" required autocomplete="email" placeholder="가입한 이메일 주소">
      </label>
      <button type="submit" class="btn btn-primary btn-block">재설정 링크 보내기</button>
    </form>
    <div class="auth-divider">
      <span>또는 인증번호로 바로 재설정</span>
    </div>
    <form id="resetPasswordByCodeForm" class="auth-form">
      <label>
        <span>이메일</span>
        <input type="email" name="email" required autocomplete="email" placeholder="가입한 이메일 주소">
      </label>
      <div class="auth-inline-actions">
        <button type="button" id="sendResetCodeBtn" class="btn btn-ghost btn-block">이메일로 인증번호 받기</button>
      </div>
      <label>
        <span>이메일 인증번호</span>
        <input type="text" name="code" required inputmode="numeric" maxlength="6" placeholder="메일로 받은 6자리 숫자">
      </label>
      <div class="auth-inline-actions">
        <button type="button" id="verifyResetCodeBtn" class="btn btn-secondary btn-block">이메일 인증 확인</button>
      </div>
      <p id="forgotPasswordCodeStatus" class="status-text"></p>
      <label>
        <span>새 비밀번호</span>
        <div class="password-input-wrap">
          <input type="password" id="forgotPasswordInput" name="password" required minlength="8" autocomplete="new-password" placeholder="새 비밀번호 입력">
          <button type="button" class="password-toggle-btn" aria-label="비밀번호 보기" aria-pressed="false">보기</button>
        </div>
        <p class="field-hint">8자 이상 · 특수문자 1개 이상 · <span class="field-hint-muted">*, &amp;, &quot; 사용 불가</span></p>
      </label>
      <label>
        <span>새 비밀번호 확인</span>
        <div class="password-input-wrap">
          <input type="password" id="forgotPasswordConfirmInput" name="password_confirm" required minlength="8" autocomplete="new-password" placeholder="비밀번호 다시 입력">
          <button type="button" class="password-toggle-btn" aria-label="비밀번호 보기" aria-pressed="false">보기</button>
        </div>
      </label>
      <button type="submit" id="resetPasswordByCodeSubmitBtn" class="btn btn-ghost btn-block" disabled>인증번호로 비밀번호 변경</button>
    </form>
    <p class="auth-footer"><a href="/login">로그인으로 돌아가기</a></p>
    <p id="forgotPasswordStatus" class="status-text"></p>
    <p id="forgotPasswordError" class="error-text" hidden></p>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}?v=20"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    AuthHelper.initForgotPassword();
  });
</script>
{% endblock %}
